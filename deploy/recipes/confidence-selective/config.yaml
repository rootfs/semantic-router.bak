version: v0.3
listeners:
- address: 0.0.0.0
  name: http-8899
  port: 8899
  timeout: 1200s
providers:
  defaults:
    default_model: Qwen2.5-7B
    default_reasoning_effort: medium
  models:
  - name: Qwen2.5-7B
    api_format: openai
    provider_model_id: Qwen2.5-7B
    backend_refs:
    - name: local-vllm-7b
      endpoint: localhost:8091
      protocol: http
      type: vllm
      weight: 1
      api_key_env: VLLM_API_KEY
    pricing:
      prompt_per_1m: 0.04
      completion_per_1m: 0.1
      currency: USD
  - name: Qwen2.5-72B
    api_format: openai
    provider_model_id: Qwen2.5-72B
    backend_refs:
    - name: vllm-72b
      endpoint: localhost:8090
      protocol: http
      type: vllm
      weight: 1
      api_key_env: VLLM_API_KEY
    pricing:
      prompt_per_1m: 0.12
      completion_per_1m: 0.39
      currency: USD
global:
  integrations:
    looper:
      endpoint: "http://localhost:8091/v1/chat/completions"
      timeout_seconds: 120
      model_endpoints:
        Qwen2.5-7B: "http://localhost:8091/v1/chat/completions"
        Qwen2.5-7B: "http://localhost:8091/v1/chat/completions"
        Qwen2.5-72B: "http://localhost:8090/v1/chat/completions"
        Qwen2.5-72B: "http://localhost:8090/v1/chat/completions"
      headers:
        Authorization: "Bearer 1E59czfahYXNW4mboXgQmVna_b4DxFBgQ0OV65JOJTfaUT5MJ0FTY1SvEafwihLr"
routing:
  decisions:
  # ESCALATE categories (5): always escalate — threshold=1.0 means confidence always < threshold
  - name: escalate_computer_science
    priority: 200
    tier: 1
    modelRefs:
    - model: Qwen2.5-7B
    - model: Qwen2.5-72B
    algorithm:
      type: confidence
      confidence:
        confidence_method: avg_logprob
        threshold: 1.0
    rules:
      operator: AND
      conditions:
      - type: category_kb
        name: __best__:computer_science

  - name: escalate_other
    priority: 200
    tier: 1
