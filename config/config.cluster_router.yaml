# Cluster Router Configuration
# This config demonstrates AvengersPro-style intelligent model routing

bert_model:
  model_id: models/all-MiniLM-L12-v2
  threshold: 0.6
  use_cpu: true

# Embedding models for cluster router
embedding_models:
  qwen3_model_path: "models/Qwen3-Embedding-0.6B"
  use_cpu: true

semantic_cache:
  enabled: false  # Disabled for testing cluster routing

tools:
  enabled: false

prompt_guard:
  enabled: false

# vLLM Endpoints Configuration
# Three specialized models for intelligent routing
vllm_endpoints:
  - name: "math"
    address: "127.0.0.1"
    port: 8081
    weight: 1
  - name: "coder"
    address: "127.0.0.1"
    port: 8082
    weight: 1
  - name: "general"
    address: "127.0.0.1"
    port: 8083
    weight: 1

# Model configuration - map model names to endpoints
model_config:
  "math":
    reasoning_family: "qwen3"
    preferred_endpoints: ["math"]
  "coder":
    reasoning_family: "qwen3"
    preferred_endpoints: ["coder"]
  "general":
    reasoning_family: "qwen3"
    preferred_endpoints: ["general"]

# Default model for fallback
default_model: "coder"

# Auto model name (triggers intelligent routing)
auto_model_name: "auto"

# Classifier configuration (minimal for cluster routing)
classifier:
  category_model:
    model_id: "models/category_classifier_modernbert-base_model"
    use_modernbert: true
    threshold: 0.6
    use_cpu: true
    category_mapping_path: "models/category_classifier_modernbert-base_model/category_mapping.json"

# Cluster Router Configuration (AvengersPro-style)
cluster_router:
  enabled: true
  
  # Number of K-means clusters
  # More clusters = finer-grained routing but may overfit
  n_clusters: 10
  
  # Maximum iterations for K-means convergence
  max_iterations: 100
  
  # Cost-performance balance factor
  # alpha = 1.0: Always select best performing model
  # alpha = 0.5: Balance performance and cost
  # alpha = 0.0: Always select cheapest model
  alpha: 0.8
  
  # Top-k clusters to consider for routing
  # Higher values provide smoother routing
  top_k: 3
  
  # Softmax temperature for cluster weighting
  # Higher beta = more focused on nearest cluster
  beta: 9.0
  
  # Use CPU for tensor operations
  use_cpu: true
  
  # Model costs for cost-aware routing (based on model size)
  model_costs:
    math: 7.0      # 7B parameter model
    coder: 7.0     # 7B parameter model
    general: 14.0  # 14B parameter model
  
  # Experience database path (JSON format)
  # Embeddings generated with qwen3 model for consistency with routing
  experience_db_path: "tutorial/cluster_router/mmlu_pro_experience_db_qwen3.json"
  
  # Embedding model for query embedding at routing time
  embedding_model: "qwen3"
  embedding_dim: 1024  # qwen3 native dimension

# Minimal categories for testing
categories:
  - name: math
    description: "Mathematics and quantitative reasoning"
  - name: coding
    description: "Programming and software development"
  - name: general
    description: "General knowledge queries"

# Simple priority-based fallback (cluster router takes precedence)
strategy: "priority"

decisions:
  - name: "math_decision"
    description: "Mathematics and quantitative reasoning"
    priority: 100
    rules:
      operator: "AND"
      conditions:
        - type: "domain"
          name: "math"
    modelRefs:
      - model: "math"
        use_reasoning: false

  - name: "coding_decision"
    description: "Programming and software development"
    priority: 100
    rules:
      operator: "AND"
      conditions:
        - type: "domain"
          name: "coding"
    modelRefs:
      - model: "coder"
        use_reasoning: false

  - name: "general_decision"
    description: "General knowledge queries"
    priority: 100
    rules:
      operator: "AND"
      conditions:
        - type: "domain"
          name: "general"
    modelRefs:
      - model: "general"
        use_reasoning: false

  - name: "auto_route"
    description: "Intelligent cluster-based routing (fallback)"
    priority: 50
    rules:
      operator: "OR"
      conditions:
        - type: "model_name"
          value: "auto"
    modelRefs:
      - model: "coder"  # Default fallback if cluster router fails
        use_reasoning: false

# API configuration
api:
  port: 8080
  max_request_body_size: 10485760  # 10MB

# Observability (minimal)
observability:
  enabled: false

