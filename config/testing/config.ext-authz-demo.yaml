# Minimal config for ext_authz demo
# Focuses on routing to OpenAI and Anthropic with user token auth

semantic_cache:
  enabled: false

tools:
  enabled: false

prompt_guard:
  enabled: false

classifier:
  category_model:
    model_id: "models/mom-domain-classifier"
    threshold: 0.6
    use_cpu: true
    category_mapping_path: "models/mom-domain-classifier/category_mapping.json"

vllm_endpoints:
  - name: "local"
    address: "127.0.0.1"
    port: 11434
    weight: 1

model_config:
  "gpt-4o":
    api_format: "openai"
  "claude-3-5-sonnet-latest":
    api_format: "anthropic"

categories:
  - name: other
    description: "General knowledge"
    mmlu_categories: ["other"]

strategy: "priority"

decisions:
  - name: "general"
    description: "General routing"
    priority: 50
    rules:
      operator: "AND"
      conditions:
        - type: "domain"
          name: "other"
    modelRefs:
      - model: "gpt-4o"
        use_reasoning: false

default_model: "gpt-4o"

# Required: tells ext_proc to set ClearRouteCache so Envoy re-evaluates
# routes after x-selected-model is set by the router
clear_route_cache: true
