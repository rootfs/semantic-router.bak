# K8s Secrets for Anthropic vs Bedrock demo
#
# Users:
#   alice — has keys for both Anthropic and Bedrock (full failover)
#   bob   — Anthropic key only (no Bedrock access)
#   carol — Bedrock key only (no Anthropic access)
#
# Authorino matches the Bearer token → injects annotation values as headers.
# The router picks the right header based on the endpoint's provider type.
---
# Alice: both Anthropic + Bedrock
apiVersion: v1
kind: Secret
metadata:
  name: user-alice
  labels:
    app: semantic-router
    demo: anthropic-bedrock
    authorino.kuadrant.io/managed-by: authorino
  annotations:
    anthropic-key: "sk-ant-alice-anthropic-key"
    bedrock-key: "alice-bedrock-sigv4-presigned-token"
    authz-groups: "engineering"
stringData:
  api_key: "ab-alice-token-1111"
type: Opaque
---
# Bob: Anthropic only
apiVersion: v1
kind: Secret
metadata:
  name: user-bob
  labels:
    app: semantic-router
    demo: anthropic-bedrock
    authorino.kuadrant.io/managed-by: authorino
  annotations:
    anthropic-key: "sk-ant-bob-anthropic-key"
    authz-groups: "engineering"
stringData:
  api_key: "ab-bob-token-2222"
type: Opaque
---
# Carol: Bedrock only
apiVersion: v1
kind: Secret
metadata:
  name: user-carol
  labels:
    app: semantic-router
    demo: anthropic-bedrock
    authorino.kuadrant.io/managed-by: authorino
  annotations:
    bedrock-key: "carol-bedrock-sigv4-presigned-token"
    authz-groups: "research"
stringData:
  api_key: "ab-carol-token-3333"
type: Opaque
