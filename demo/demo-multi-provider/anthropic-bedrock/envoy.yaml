# Envoy config for Anthropic vs Bedrock demo
#
# Pipeline: Client → Envoy :8801 → ext_authz (Authorino :50052) → ext_proc (Router :50051) → upstream
#
# Routing:
#   The ext_proc sets x-selected-model and x-vsr-destination-endpoint.
#   Envoy routes based on x-selected-model:
#     - claude-*-bedrock  → bedrock_cluster  (AWS Bedrock runtime, HTTPS)
#     - claude-*          → anthropic_cluster (Anthropic API, HTTPS)
#     - default           → anthropic_cluster (fallback)
#
# Note: x-vsr-destination-endpoint is only used by the ORIGINAL_DST cluster
# for local backends. For LOGICAL_DNS cloud clusters, Envoy uses the
# cluster's configured address. The ext_proc still sets the correct
# :authority and :path for the upstream via header mutations.

static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8801
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  time: "%START_TIME%"
                  method: "%REQ(:METHOD)%"
                  path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                  status: "%RESPONSE_CODE%"
                  duration_ms: "%DURATION%"
                  upstream: "%UPSTREAM_HOST%"
                  cluster: "%UPSTREAM_CLUSTER%"
                  model: "%REQ(X-SELECTED-MODEL)%"
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              # Bedrock route — explicit bedrock alias
              - match:
                  prefix: "/"
                  headers:
                  - name: x-selected-model
                    string_match:
                      suffix: "-bedrock"
                route:
                  cluster: bedrock_cluster
                  timeout: 300s
                  host_rewrite_literal: "bedrock-runtime.us-east-1.amazonaws.com"
              # Anthropic route — claude-* models (direct Anthropic API)
              - match:
                  prefix: "/"
                  headers:
                  - name: x-selected-model
                    string_match:
                      prefix: "claude-"
                route:
                  cluster: anthropic_cluster
                  timeout: 300s
                  host_rewrite_literal: "api.anthropic.com"
              # Default → Anthropic
              - match:
                  prefix: "/"
                route:
                  cluster: anthropic_cluster
                  timeout: 300s
                  host_rewrite_literal: "api.anthropic.com"
          http_filters:
          # 1. ext_authz — Authorino validates Bearer token, injects provider keys
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              grpc_service:
                envoy_grpc:
                  cluster_name: authorino_service
              transport_api_version: V3
              failure_mode_allow: false
          # 2. ext_proc — Router selects model, sets auth headers, rewrites path
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc:
                  cluster_name: extproc_service
              allow_mode_override: true
              processing_mode:
                request_header_mode: "SEND"
                response_header_mode: "SEND"
                request_body_mode: "BUFFERED"
                response_body_mode: "BUFFERED"
                request_trailer_mode: "SKIP"
                response_trailer_mode: "SKIP"
              failure_mode_allow: true
              message_timeout: 300s
          # 3. Router filter — must be last
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              suppress_envoy_headers: true
          http2_protocol_options:
            max_concurrent_streams: 100
            initial_stream_window_size: 65536
            initial_connection_window_size: 1048576
          stream_idle_timeout: "300s"
          request_timeout: "300s"
          common_http_protocol_options:
            idle_timeout: "300s"

  clusters:
  # ── Semantic Router ext_proc (gRPC) ──
  - name: extproc_service
    connect_timeout: 300s
    per_connection_buffer_limit_bytes: 52428800
    type: STATIC
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options:
            connection_keepalive:
              interval: 300s
              timeout: 300s
    load_assignment:
      cluster_name: extproc_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 50051

  # ── Authorino ext_authz (gRPC) ──
  - name: authorino_service
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: authorino_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 50052

  # ── Anthropic API (HTTPS) ──
  - name: anthropic_cluster
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    connect_timeout: 60s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: anthropic_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: api.anthropic.com
                port_value: 443
            hostname: "api.anthropic.com"
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: api.anthropic.com

  # ── AWS Bedrock Runtime (HTTPS) ──
  - name: bedrock_cluster
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    connect_timeout: 60s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: bedrock_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: bedrock-runtime.us-east-1.amazonaws.com
                port_value: 443
            hostname: "bedrock-runtime.us-east-1.amazonaws.com"
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: bedrock-runtime.us-east-1.amazonaws.com

admin:
  address:
    socket_address:
      address: "127.0.0.1"
      port_value: 19000
