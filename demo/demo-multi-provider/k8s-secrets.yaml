# K8s Secrets for Multi-Cloud Provider demo
#
# Each user's Secret holds their local Bearer token (api_key)
# and per-provider API keys in annotations.
#
# When Authorino matches the Bearer token, it injects the annotation values
# as response headers (x-user-openai-key, x-user-anthropic-key, etc.)
#
# Users:
#   alice — has keys for OpenAI + Anthropic + Azure (all providers)
#   bob   — has keys for OpenAI + Azure only (no Anthropic)
#   carol — has keys for Anthropic only
---
# Alice: full multi-provider access
apiVersion: v1
kind: Secret
metadata:
  name: user-alice
  labels:
    app: semantic-router
    demo: multi-provider
    authorino.kuadrant.io/managed-by: authorino
  annotations:
    openai-key: "sk-proj-alice-openai-key"
    anthropic-key: "sk-ant-alice-anthropic-key"
    azure-openai-key: "alice-azure-openai-api-key"
    authz-groups: "engineering"
stringData:
  api_key: "mp-alice-token-1111"
type: Opaque
---
# Bob: OpenAI + Azure (no Anthropic)
apiVersion: v1
kind: Secret
metadata:
  name: user-bob
  labels:
    app: semantic-router
    demo: multi-provider
    authorino.kuadrant.io/managed-by: authorino
  annotations:
    openai-key: "sk-proj-bob-openai-key"
    azure-openai-key: "bob-azure-openai-api-key"
    authz-groups: "engineering"
stringData:
  api_key: "mp-bob-token-2222"
type: Opaque
---
# Carol: Anthropic only
apiVersion: v1
kind: Secret
metadata:
  name: user-carol
  labels:
    app: semantic-router
    demo: multi-provider
    authorino.kuadrant.io/managed-by: authorino
  annotations:
    anthropic-key: "sk-ant-carol-anthropic-key"
    authz-groups: "research"
stringData:
  api_key: "mp-carol-token-3333"
type: Opaque
